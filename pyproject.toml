[project]
name = "audio-reactive-visualizer"
version = "1.1.0"
description = "Audio → Instagram-friendly audio-reactive visualizer clips. Built for noise and experimental music."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "blodigel" }]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    "numpy>=2.0.0",
    "scipy>=1.14.0",
    "soundfile>=0.12.1",
    "opencv-python-headless>=4.10.0,<5",
    "pillow>=10.4.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.0",
    "pytest>=8.3.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
